<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gov.br Digital | Assinatura</title>
    <style>
        :root {
            /* Cores oficiais Gov.br */
            --gov-blue: #1a237e;
            --gov-blue-dark: #0d164d;
            --gov-green: #007934;
            --bg-gray: #f4f5f7;
            --card-bg: #ffffff;
            --text-dark: #202124;
            --text-light: #5f6368;
            --border: #dadce0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Container principal */
        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 16px;
        }

        /* Card Branco */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08), 0 10px 24px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        /* Cabeçalho */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--gov-blue);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--gov-blue);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .status {
            font-size: 12px;
            color: var(--gov-green);
            background: #e6f4ea;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Corpo */
        .content { padding: 24px; }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
            font-weight: 600;
            color: var(--text-dark);
        }

        p {
            font-size: 14px;
            color: var(--text-light);
            margin: 0 0 20px;
            line-height: 1.5;
        }

        /* Caixa do Arquivo */
        .file-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-left: 4px solid var(--gov-blue);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }

        .file-meta {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
        }

        /* Botão */
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--gov-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background: var(--gov-blue-dark); }
        .btn:active { transform: scale(0.98); }

        /* Rodapé */
        .footer {
            background: #fafafa;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .secure {
            font-size: 12px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Iframe oculto para abrir o app silenciosamente */
        .hidden-frame {
            position: absolute;
            width: 0;
            height: 0;
            border: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Iframe invisível para abrir o app sem piscar -->
    <iframe id="appFrame" class="hidden-frame" src="about:blank"></iframe>

    <div class="app-container">
        <div class="card">
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">G</div>
                    <span>Gov.br Digital</span>
                </div>
                <div class="status">✓ Verificado</div>
            </div>

            <div class="content">
                <h1>Assinatura Pendente</h1>
                <p>Você tem um documento para assinar. O processo é seguro e direto.</p>

                <div class="file-box">
                    <span class="file-name">Contrato_Financeiro_2026.pdf</span>
                    <div class="file-meta">
                        <span>Ministério da Economia</span>
                        <span>27/09/2026</span>
                    </div>
                </div>

                <button class="btn" onclick="assinarApp()">
                    Assinar com Gov.br
                </button>
            </div>

            <div class="footer">
                <div class="secure">
                    🔒 Conexão Privativa
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SEU APP
        const APP_SCHEME = "meuapp://"; // Troque pelo seu protocolo
        const APP_ACTION = "assinar";
        const APP_ID = "doc-99283"; // ID do documento para passar no link

        function abrirAppSilenciosamente() {
            // Tenta abrir via iframe invisível (evita piscar a tela)
            const frame = document.getElementById('appFrame');
            const targetUrl = `${APP_SCHEME}${APP_ACTION}?id=${APP_ID}`;
            
            // Método 1: Tenta carregar no iframe
            frame.src = targetUrl;
            
            // Método 2: Fallback para abrir direto se iframe falhar
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        }

        function assinarApp() {
            const btn = document.querySelector('.btn');
            btn.innerHTML = "Aguardando App...";
            btn.style.opacity = "0.8";
            
            abrirAppSilenciosamente();
            
            // Reseta o botão após 2s se não tiver resposta
            setTimeout(() => {
                btn.innerHTML = "Assinar com Gov.br";
                btn.style.opacity = "1";
            }, 2000);
        }
    </script>

</body>
</html>
