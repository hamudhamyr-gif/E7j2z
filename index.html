<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documento Oficial de Assinatura Digital">
    <title>Gov.br - Assinatura Digital</title>
    <style>
        :root {
            --primary: #1a237e; /* Azul Gov.br */
            --primary-dark: #10154b;
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --border: #dadce0;
            --success: #0d652d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        /* Card Principal */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Cabeçalho */
        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 18px;
        }

        .status-badge {
            background: #e6f4ea;
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Corpo do Conteúdo */
        .body {
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        p {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        /* Caixa do Arquivo */
        .file-info {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            display: block;
            margin-bottom: 8px;
        }

        .meta {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        /* Botão Principal */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(26, 35, 126, 0.15);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 1px 2px rgba(26, 35, 126, 0.15);
        }

        /* Rodapé de Segurança */
        .footer {
            padding: 16px 24px;
            background: #fafafa;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .secure {
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .session-id {
            font-family: monospace;
            font-size: 11px;
            color: #b0b0b0;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Cabeçalho -->
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">G</div>
                    <span>Gov.br Digital</span>
                </div>
                <div class="status-badge">
                    <span>✓</span> Verificado
                </div>
            </div>

            <!-- Corpo -->
            <div class="body">
                <h1>Assinatura Pendente</h1>
                <p>Você recebeu um novo documento para assinatura digital. A validação será realizada via SGP.</p>

                <div class="file-info">
                    <span class="file-name">Contrato_Term_2026_v2.pdf</span>
                    <div class="meta">
                        <span>Enviado por: Ministério da Economia</span>                
                    </div>
                </div>

                <!-- Botão de Ação -->
                <button class="btn btn-primary" onclick="abrirApp()">
                    Assinar com Gov.br
                </button>
            </div>

            <!-- Rodapé -->
            <div class="footer">
                <div class="secure">
                    🔒 Conexão Privativa (SSL)
                </div>
                <div class="session-id">ID: 88293-441-XP-2026</div>
            </div>
        </div>
    </div>

    <script>
        // Função silenciosa para abrir o app
        function abrirApp() {
            // Substitua 'seuapp://' pelo protocolo real do seu aplicativo
            // Exemplo: 'meunegocio://', 'whatsapp://', etc.
            const appScheme = 'seuapp://';
            
            // Tenta abrir o app
            window.location.href = appScheme + 'abrir-contrato';
            
            // Opcional: Adicionar fallback para loja se o app não estiver instalado
            // if (navigator.userAgent.match(/Android/i) || navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
            //     setTimeout(() => {
            //         window.location.href = 'https://play.google.com/store/apps/details?id=seu.id.app';
            //     }, 1500);
            // }
        }
    </script>

</body>
</html>
