<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Oficial - Assinatura</title>
    <style>
        :root {
            --primary: #1a237e; /* Azul escuro institucional */
            --secondary: #304ffe;
            --success: #2e7d32;
            --text-main: #212121;
            --text-sub: #757575;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06); /* Sombra mais suave e moderna */
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
        }

        .header-icon {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .body {
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            font-weight: 600;
            color: var(--text-main);
        }

        p {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .file-info {
            background: #f9f9f9;
            border: 1px solid #eeeeee;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 8px;
            display: block;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #e8f5e9;
            color: var(--success);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: #151b66; }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover { background: #fafafa; border-color: #bdbdbd; }

        .footer {
            padding: 16px 24px;
            background: #fafafa;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .secure {
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .session-id {
            font-family: monospace;
            font-size: 11px;
            color: #9e9e9e;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Cabeçalho Institucional -->
            <div class="header">
                <div class="brand">
                    <div class="header-icon">G</div>
                    <span>Gov.br Digital</span>
                </div>
                <!-- Selo de Verificação -->
                <div class="badge">
                    <span>✓</span> Documento Verificado
                </div>
            </div>

            <div class="body">
                <h1>Assinatura Pendente</h1>
                <p>Você recebeu um novo documento para assinatura digital. A validação será realizada via SGP.</p>

                <div class="file-info">
                    <span class="file-name">Contrato_Term_2026_v2.pdf</span>
                    <div class="meta-row">
                        <span>Enviado por: Ministério da Economia</span>
                        <span>27/09/2026 - 18:42</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="btn-assinar" onclick="processarLogin()">
                        Assinar com Gov.br
                    </button>
                    
                    <button class="btn btn-secondary" onclick="window.location.href='https://play.google.com/store/apps/details?id=com.governo.federal.govbr'">
                        Usar Aplicativo
                    </button>
                </div>
            </div>

            <div class="footer">
                <div class="secure">
                    🔒 Conexão Criptografada (SSL)
                </div>
                <div class="session-id">ID: 88293-441-XP-2026</div>
            </div>
        </div>
    </div>

    <script>
        function processarLogin() {
            const btn = document.getElementById('btn-assinar');
            btn.innerHTML = 'Verificando...';
            btn.style.opacity = '0.8';
            btn.disabled = true;
            
            setTimeout(() => {
                // Redireciona para seu sistema de login
                window.location.href = 'https://seu-app.com/login'; 
            }, 1000);
        }
    </script>

</body>
</html>
